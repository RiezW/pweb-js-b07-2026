<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mini Shopee</title>
  <link rel="stylesheet" href="login.css">
  <!-- External JavaScript dengan defer -->
  <script src="login.js" defer></script>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h2>Selamat Datang</h2>
      <p>Silakan masuk ke akun Anda</p>
    </div>

    <!-- Container Pesan Error / Notifikasi -->
    <div id="error-message" class="error-banner hidden" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>

        <div class="input-wrapper">
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Masukkan username (contoh: emilys)" 
            required 
            autocomplete="username"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Masukkan password" 
            required 
            autocomplete="current-password"
          >
          <!-- Bonus Feature: Toggle Show/Hide Password -->
          <button type="button" id="toggle-password" class="toggle-pwd-btn" aria-label="Tampilkan Password">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="btn-login">
        <span class="btn-text">Masuk</span>
        <!-- Loading Spinner -->
        <span class="spinner hidden" id="loading-spinner"></span>
      </button>
    </form>


  </div>
</body>
</html>
